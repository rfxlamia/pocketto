name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch the pinned v3.1.3 source tag
        run: git fetch --depth=1 origin tag v3.1.3
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm test
