<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 460" font-family="'Virgil','Excalifont','Segoe Print','Comic Sans MS',cursive" width="980" height="460">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8b919b"/>
    </marker>
    <style>
      .box { stroke:#1e1e1e; stroke-width:2; rx:14; ry:14; stroke-linejoin:round; }
      .lbl { fill:#1e1e1e; font-size:15px; text-anchor:middle; dominant-baseline:central; }
      .sub { fill:#495057; font-size:13px; text-anchor:middle; dominant-baseline:central; }
      .badge { fill:#ffffff; stroke:#1e1e1e; stroke-width:1.5; }
      .num { fill:#1e1e1e; font-size:12px; text-anchor:middle; dominant-baseline:central; }
      .hdr { fill:#8b919b; font-size:16px; font-weight:bold; }
      .flow { stroke:#8b919b; stroke-width:2.5; fill:none; }
      .caption { fill:#8b919b; font-size:13px; text-anchor:middle; }
    </style>
  </defs>

  <!-- ===== Pipeline header ===== -->
  <text class="hdr" x="20" y="34">The Pocket Pipeline · idea → reviewed, shipped code</text>

  <!-- ===== Pipeline boxes ===== -->
  <!-- 1 pitching -->
  <rect class="box" x="20"  y="56" width="132" height="74" fill="#d0bfff"/>
  <text class="lbl" x="86"  y="93">pitching</text>
  <circle class="badge" cx="34" cy="70" r="11"/><text class="num" x="34" y="70">1</text>

  <!-- 2 grinding -->
  <rect class="box" x="184" y="56" width="132" height="74" fill="#a5d8ff"/>
  <text class="lbl" x="250" y="93">grinding</text>
  <circle class="badge" cx="198" cy="70" r="11"/><text class="num" x="198" y="70">2</text>

  <!-- 3 planning -->
  <rect class="box" x="348" y="56" width="132" height="74" fill="#99e9f2"/>
  <text class="lbl" x="414" y="93">planning</text>
  <circle class="badge" cx="362" cy="70" r="11"/><text class="num" x="362" y="70">3</text>

  <!-- 4 structuring -->
  <rect class="box" x="512" y="56" width="132" height="74" fill="#b2f2bb"/>
  <text class="lbl" x="578" y="93">structuring</text>
  <circle class="badge" cx="526" cy="70" r="11"/><text class="num" x="526" y="70">4</text>

  <!-- 5 development -->
  <rect class="box" x="676" y="56" width="132" height="74" fill="#ffec99"/>
  <text class="lbl" x="742" y="93">development</text>
  <circle class="badge" cx="690" cy="70" r="11"/><text class="num" x="690" y="70">5</text>

  <!-- 6 closing -->
  <rect class="box" x="840" y="56" width="132" height="74" fill="#ffc9c9"/>
  <text class="lbl" x="906" y="93">closing</text>
  <circle class="badge" cx="854" cy="70" r="11"/><text class="num" x="854" y="70">6</text>

  <!-- arrows between pipeline boxes -->
  <line class="flow" x1="154" y1="93" x2="182" y2="93" marker-end="url(#arrow)"/>
  <line class="flow" x1="318" y1="93" x2="346" y2="93" marker-end="url(#arrow)"/>
  <line class="flow" x1="482" y1="93" x2="510" y2="93" marker-end="url(#arrow)"/>
  <line class="flow" x1="646" y1="93" x2="674" y2="93" marker-end="url(#arrow)"/>
  <line class="flow" x1="810" y1="93" x2="838" y2="93" marker-end="url(#arrow)"/>

  <text class="caption" x="475" y="150">each stage hands off spec + plan + acceptance criteria to the next</text>

  <!-- ===== Standalone header ===== -->
  <text class="hdr" x="20" y="220">Standalone · grab any one, no pipeline needed</text>

  <!-- standalone boxes -->
  <rect class="box" x="20" y="244" width="220" height="64" fill="#f1f3f5"/>
  <text class="lbl" x="130" y="270">pocket-help</text>
  <text class="sub" x="130" y="291">what is Pocket / routing</text>

  <rect class="box" x="260" y="244" width="220" height="64" fill="#f1f3f5"/>
  <text class="lbl" x="370" y="270">pocket-init</text>
  <text class="sub" x="370" y="291">onboard + enterprise setup</text>

  <rect class="box" x="500" y="244" width="220" height="64" fill="#f1f3f5"/>
  <text class="lbl" x="610" y="270">bug-hunting</text>
  <text class="sub" x="610" y="291">root cause before fix</text>

  <rect class="box" x="740" y="244" width="220" height="64" fill="#f1f3f5"/>
  <text class="lbl" x="850" y="270">hotfix</text>
  <text class="sub" x="850" y="291">small change, reviewed</text>

  <rect class="box" x="140" y="324" width="220" height="64" fill="#f1f3f5"/>
  <text class="lbl" x="250" y="350">brand-design</text>
  <text class="sub" x="250" y="371">design system + brief</text>

  <rect class="box" x="380" y="324" width="220" height="64" fill="#f1f3f5"/>
  <text class="lbl" x="490" y="350">structured-research</text>
  <text class="sub" x="490" y="371">validate an assumption</text>

  <rect class="box" x="620" y="324" width="220" height="64" fill="#f1f3f5"/>
  <text class="lbl" x="730" y="350">create-pr</text>
  <text class="sub" x="730" y="371">enterprise PR recorder</text>

  <text class="caption" x="490" y="428">13 skills total · works in Claude Code and Pi</text>
</svg>
